[package]
name = "foldersync-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "foldersync_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fs-sync-daemon.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true
fs-sync-net.workspace = true
fs-sync-core.workspace = true
fs-sync-store.workspace = true
russh.workspace = true
russh-sftp.workspace = true
blake3.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
# 自动更新（对接自建 Basic 版本更新服务，见 src/updater.rs）。
# rustls 用 ring：默认的 aws-lc 需要 C 编译器/NASM，CI 和本地都容易出问题
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ed25519-dalek = "3"
md-5 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true
