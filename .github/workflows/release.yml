name: Release

# 版本自动发布流程（基于 GitHub Releases + Tauri updater）
#
# 触发方式二选一：
#   1. 推送形如 v0.2.0 的 tag（推荐，`git tag v0.2.0 && git push --tags`）
#   2. 在 Actions 页面手动 Run workflow
#
# 产出：
#   - 各平台安装包（Windows NSIS/MSI、macOS dmg、Linux AppImage/deb）
#   - latest.json —— updater 的清单，客户端从这里判断有没有新版本
#   - 带签名的 .sig 文件（私钥在 TAURI_SIGNING_PRIVATE_KEY secret 里）
#
# 关键点：latest.json 必须作为 release 的 asset 上传，且 tag 要是
# latest（非 prerelease），客户端才能从 /releases/latest/download/latest.json 取到。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # 先跑一次质量门禁，不通过就不发版
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # 只用 tauri-action 构建 + 签名，不上传。
      #
      # 不用 action 自带的 release 上传，因为它靠 `info.name` 猜产物文件名：
      # Linux 上 Tauri 把 productName "FolderSync" 转成 kebab-case "folder-sync"，
      # action 仍按 "FolderSync" 找文件，于是 "No artifacts were found"。
      # 我们自己 glob 实际产物再上传，跨平台都可靠。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 私钥没有密码，必须显式给空串 + CI=true：
          # 只给空串时 tauri CLI 认为"变量未设置"，会交互式提示密码，
          # 在无 TTY 的 CI 里直接卡死（本地实测过）。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CI: true
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          # 不传 tagName，action 就不会尝试创建 release
          releaseDraft: true
      - name: 上传产物到 Release
        # 用 find 直接找实际产物再传，不经过中间变量：
        # 早期版本用 mapfile 收集，在 Linux/macOS 上拿到空数组（find 明明有输出），
        # 白白多花两轮 CI。少一层间接就少一个出错的地方。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}"

          # 第一个跑到的 job 创建 release，其它 job 追加资产
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "FolderSync $TAG" \
              --notes "已安装旧版的用户可在应用内检查更新升级。"
          fi

          # 四平台产物扩展名不同，统一找一遍
          count=0
          while IFS= read -r -d '' f; do
            echo "uploading $f"
            gh release upload "$TAG" "$f" --clobber
            count=$((count + 1))
          done < <(find target/release/bundle -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" \
               -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.sig" \) -print0)

          if [ "$count" -eq 0 ]; then
            echo "no artifacts found" >&2
            exit 1
          fi
          echo "uploaded $count artifacts"


      - name: 生成平台更新清单碎片
        # updater 的 latest.json 需要把所有平台合并进一个文件。四个 job 并发跑，
        # 各自写自己的碎片（updater-<target>.json），最后由专门的 merge job 合并。
        # 直接并发写同一个 latest.json 会互相覆盖。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fragments
          # python vs python3：Windows runner 只有 python，macOS 只有 python3。
          # 写死任何一个都会在别的平台 exit 127。
          PY=$(command -v python3 || command -v python)
          [ -n "$PY" ] || { echo "no python found" >&2; exit 1; }
          "$PY" - <<'PYEOF'
          import glob, json, os, pathlib

          files = [f for f in glob.glob("target/release/bundle/**/*", recursive=True)
                   if os.path.isfile(f)]
          version = os.environ["VERSION"]

          def url(name):
              return f"https://github.com/ashu1800/foldersync/releases/download/v{version}/{name}"

          # updater 认这几种包；deb/rpm 不是 updater 格式，不上报
          wanted = {
              ".exe": "windows-x86_64",
              ".AppImage": "linux-x86_64",
              ".dmg": None,  # 按文件名里的架构决定
          }

          got = {}
          for f in files:
              if f.endswith(".sig"):
                  continue
              ext = pathlib.Path(f).suffix
              if ext not in wanted:
                  continue
              sig = f + ".sig"
              if not os.path.exists(sig):
                  continue
              if ext == ".dmg":
                  target = "darwin-aarch64" if "aarch64" in f else "darwin-x86_64"
              else:
                  target = wanted[ext]
              got[target] = {
                  "signature": open(sig).read().strip(),
                  "url": url(os.path.basename(f)),
              }

          if not got:
              # 这个平台没有 updater 格式的产物（比如只出了 deb），不算失败
              print("no updater artifacts on this platform, skipping")
              raise SystemExit(0)

          for target, entry in got.items():
              out = pathlib.Path(f"fragments/updater-{target}.json")
              out.write_text(json.dumps({target: entry}, indent=2))
              print(f"wrote {out}: {entry['url']}")
          PYEOF
        env:
          VERSION: ${{ github.ref_name }}
          # Windows runner 的 Python 默认 stdout 是 cp1252，输出中文会
          # UnicodeEncodeError 崩掉（实测过）。脚本输出一律英文。
          PYTHONIOENCODING: utf-8

      - name: 上传清单碎片
        uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-${{ matrix.platform }}-${{ strategy.job-index }}
          path: fragments/
          if-no-files-found: ignore

  # 合并四个平台产出的清单碎片，生成 updater 认识的 latest.json
  latest-json:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 收集各平台碎片
        uses: actions/download-artifact@v4
        with:
          pattern: updater-fragment-*
          path: fragments
          merge-multiple: true

      - name: 合并为 latest.json 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}"
          VERSION="${TAG#v}"

          PY=$(command -v python3 || command -v python)
          [ -n "$PY" ] || { echo "no python found" >&2; exit 1; }
          "$PY" - "$VERSION" <<'PYEOF'
          import glob, json, pathlib, sys
          version = sys.argv[1]

          platforms = {}
          for f in glob.glob("fragments/updater-*.json"):
              platforms.update(json.loads(pathlib.Path(f).read_text()))

          if not platforms:
              raise SystemExit("no updater manifests found; check builds produced .sig files")

          doc = {
              "version": version,
              "notes": f"FolderSync {version}",
              "platforms": platforms,
          }
          pathlib.Path("latest.json").write_text(json.dumps(doc, indent=2))
          print(json.dumps(doc, indent=2))
          PYEOF

          gh release upload "$TAG" latest.json --clobber
          COUNT=$("$PY" -c "import json;print(len(json.load(open('latest.json'))['platforms']))")
          echo "latest.json uploaded, platforms: $COUNT"
