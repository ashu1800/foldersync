name: Release

# 版本自动发布流程（基于 GitHub Releases + Tauri updater）
#
# 触发方式二选一：
#   1. 推送形如 v0.2.0 的 tag（推荐，`git tag v0.2.0 && git push --tags`）
#   2. 在 Actions 页面手动 Run workflow
#
# 产出：
#   - Windows 安装包（NSIS）
#   - latest.json —— updater 的清单，客户端从这里判断有没有新版本
#   - 带签名的 .sig 文件（私钥在 TAURI_SIGNING_PRIVATE_KEY secret 里）
#
# 关键点：latest.json 必须作为 release 的 asset 上传，且 tag 要是
# latest（非 prerelease），客户端才能从 /releases/latest/download/latest.json 取到。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # 先跑一次质量门禁，不通过就不发版
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只发 Windows。macOS/Linux 先不打包：用户实际只跑 Windows，
          # 多平台只会拖长发布链路、增加失败面。
          - platform: windows-latest
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # 只用 tauri-action 构建 + 签名，不上传。
      #
      # 不用 action 自带的 release 上传，因为它靠 `info.name` 猜产物文件名：
      # Linux 上 Tauri 把 productName "FolderSync" 转成 kebab-case "folder-sync"，
      # action 仍按 "FolderSync" 找文件，于是 "No artifacts were found"。
      # 我们自己 glob 实际产物再上传，跨平台都可靠。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 私钥没有密码，必须显式给空串 + CI=true：
          # 只给空串时 tauri CLI 认为"变量未设置"，会交互式提示密码，
          # 在无 TTY 的 CI 里直接卡死（本地实测过）。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CI: true
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          # 不传 tagName：action 就不会自己建 release，由下面那步统一做。
          # 也绝不能传 releaseDraft —— 早期这个参数在，导致 gh release create
          # 建出来的 release 是草稿，草稿不出现在 releases/latest，
          # 客户端的 updater 永远 404，自动更新形同虚设。
      - name: 上传产物到 Release
        # 用 find 直接找实际产物再传，不经过中间变量：
        # 早期版本用 mapfile 收集，在 Linux/macOS 上拿到空数组（find 明明有输出），
        # 白白多花两轮 CI。少一层间接就少一个出错的地方。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}"
          VERSION="${TAG#v}"

          # 第一个跑到的 job 创建 release，其它 job 追加资产。
          #
          # 必须显式 --draft=false：gh release create 会建出草稿，
          # 而草稿不出现在 releases/latest，客户端的 updater 直接 404。
          # 这个坑害得自动更新整个链路失效过，别删这个参数。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft=false \
              --title "FolderSync $TAG" \
              --notes "已安装旧版的用户可在应用内检查更新升级。"
          fi

          # 四平台产物扩展名不同，统一找一遍。
          # 注意路径：带 --target 构建时（macOS 两个 job）产物在
          # target/<triple>/release/bundle，不在 target/release/bundle，
          # 所以从 target 往下匹配 */release/bundle/*。
          #
          # macOS 的 .app.tar.gz 两个架构同名（都叫 FolderSync.app.tar.gz），
          # 直接传会互相覆盖，导致两个架构的更新包变成同一个文件。
          # 上传前改名把架构带上，配套的 .sig 也要同步改名。
          count=0
          while IFS= read -r -d '' f; do
            upload="$f"
            case "$f" in
              *.app.tar.gz|*.app.tar.gz.sig)
                # 取架构：路径里带 aarch64 就是 arm，否则 x64
                case "$f" in
                  *aarch64*) arch="aarch64" ;;
                  *)         arch="x64" ;;
                esac
                case "$f" in
                  *.sig) base="FolderSync_${VERSION}_${arch}.app.tar.gz.sig" ;;
                  *)     base="FolderSync_${VERSION}_${arch}.app.tar.gz" ;;
                esac
                upload="/tmp/$base"
                cp "$f" "$upload"
                ;;
            esac
            echo "uploading $upload"
            gh release upload "$TAG" "$upload" --clobber
            count=$((count + 1))
          done < <(find target -path "*/release/bundle/*" -type f \
            \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" \
               -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.app.tar.gz" \
               -o -name "*.sig" \) -print0)

          if [ "$count" -eq 0 ]; then
            echo "no artifacts found" >&2
            exit 1
          fi
          echo "uploaded $count artifacts"


      - name: 生成平台更新清单碎片
        # updater 的 latest.json 需要把所有平台合并进一个文件。四个 job 并发跑，
        # 各自写自己的碎片（updater-<target>.json），最后由专门的 merge job 合并。
        # 直接并发写同一个 latest.json 会互相覆盖。
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fragments
          # python vs python3：Windows runner 只有 python，macOS 只有 python3。
          # 写死任何一个都会在别的平台 exit 127。
          PY=$(command -v python3 || command -v python)
          [ -n "$PY" ] || { echo "no python found" >&2; exit 1; }
          "$PY" - <<'PYEOF'
          import glob, json, os, pathlib

          files = [f for f in glob.glob("target/**/release/bundle/**/*", recursive=True)
                   if os.path.isfile(f)]
          # VERSION 来自 github.ref_name，带 v 前缀（v0.1.0），
          # 文件名里要的是裸版本号（0.1.0），否则会拼出 FolderSync_v0.1.0_x64.app.tar.gz
          version = os.environ["VERSION"].lstrip("v")
          # shell 变量在 python 里访问不到，必须从 env 读
          tag = os.environ["TAG"]

          def url(name):
              # tag 已带 v 前缀（v0.1.0），别再拼一个 v
              return f"https://github.com/ashu1800/foldersync/releases/download/{tag}/{name}"

          # updater 各平台认的包类型不同：
          #   Windows -> nsis 的 .exe（Tauri 会自己加 .nsis.zip 后缀）
          #   Linux   -> .AppImage
          #   macOS   -> .app.tar.gz（不是 .dmg！dmg 不能原地替换 app）

          got = {}
          for f in files:
              if f.endswith(".sig"):
                  continue
              name = os.path.basename(f)
              sig = f + ".sig"
              if not os.path.exists(sig):
                  continue

              if name.endswith(".app.tar.gz"):
                  arch = "aarch64" if "aarch64" in f else "x64"
                  target = f"darwin-{'aarch64' if arch == 'aarch64' else 'x86_64'}"
                  # 上传步骤把它改名成带架构的文件名，URL 必须跟着改，
                  # 否则两个架构都指向同一个 FolderSync.app.tar.gz
                  name = f"FolderSync_{version}_{arch}.app.tar.gz"
              elif name.endswith(".exe"):
                  target = "windows-x86_64"
              elif name.endswith(".AppImage"):
                  target = "linux-x86_64"
              else:
                  continue

              got[target] = {
                  "signature": open(sig).read().strip(),
                  "url": url(name),
              }

          if not got:
              # 这个平台没有 updater 格式的产物（比如只出了 deb），不算失败
              print("no updater artifacts on this platform, skipping")
              raise SystemExit(0)

          for target, entry in got.items():
              out = pathlib.Path(f"fragments/updater-{target}.json")
              out.write_text(json.dumps({target: entry}, indent=2))
              print(f"wrote {out}: {entry['url']}")
          PYEOF
        env:
          VERSION: ${{ github.ref_name }}
          # release 的 tag 名（带 v 前缀），拼下载 URL 用
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          # Windows runner 的 Python 默认 stdout 是 cp1252，输出中文会
          # UnicodeEncodeError 崩掉（实测过）。脚本输出一律英文。
          PYTHONIOENCODING: utf-8

      - name: 上传清单碎片
        uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-${{ matrix.platform }}-${{ strategy.job-index }}
          path: fragments/
          if-no-files-found: ignore

  # 合并四个平台产出的清单碎片，生成 updater 认识的 latest.json
  latest-json:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 收集各平台碎片
        uses: actions/download-artifact@v4
        with:
          pattern: updater-fragment-*
          path: fragments
          merge-multiple: true

      - name: 合并为 latest.json 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}"
          VERSION="${TAG#v}"

          PY=$(command -v python3 || command -v python)
          [ -n "$PY" ] || { echo "no python found" >&2; exit 1; }
          "$PY" - "$VERSION" <<'PYEOF'
          import glob, json, pathlib, sys
          version = sys.argv[1]

          platforms = {}
          for f in glob.glob("fragments/updater-*.json"):
              platforms.update(json.loads(pathlib.Path(f).read_text()))

          if not platforms:
              raise SystemExit("no updater manifests found; check builds produced .sig files")

          doc = {
              "version": version,
              "notes": f"FolderSync {version}",
              "pub_date": __import__("datetime").datetime.now(
                  __import__("datetime").timezone.utc
              ).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          pathlib.Path("latest.json").write_text(json.dumps(doc, indent=2))
          print(json.dumps(doc, indent=2))
          PYEOF

          gh release upload "$TAG" latest.json --clobber
          COUNT=$("$PY" -c "import json;print(len(json.load(open('latest.json'))['platforms']))")
          echo "latest.json uploaded, platforms: $COUNT"

  # 发布到自建 Basic 版本更新服务（0.2.5 起客户端从这里检测更新）。
  #
  # 上面的 GitHub Release + latest.json 只为 0.2.4 及更早的客户端保留：
  # 它们只认 GitHub，靠它升到 0.2.5 后就换成这里。所有旧客户端都升级后可删掉那两步。
  #
  # 只在推 tag 时运行：手动 Run workflow 的版本号是 run_number 拼的，不能发到正式更新通道。
  publish-basic:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern "FolderSync_${VERSION}_x64-setup.exe" --dir dist
          ls -l dist

      - name: 签名并上传到更新服务
        env:
          BASIC_ADMIN_EMAIL: ${{ secrets.BASIC_ADMIN_EMAIL }}
          BASIC_ADMIN_PASSWORD: ${{ secrets.BASIC_ADMIN_PASSWORD }}
          FOLDERSYNC_UPDATE_SIGNING_KEY: ${{ secrets.FOLDERSYNC_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          pip install --quiet cryptography
          python3 scripts/publish_update.py "dist/FolderSync_${VERSION}_x64-setup.exe" "$VERSION" \
            --changelog CHANGELOG.md
