name: CI
on:
  push:
    branches: [main]
  pull_request:
  # 允许 release.yml 复用这两个 job 作为发版前的质量门禁
  workflow_call:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: 版本号一致性
        shell: bash
        run: ./scripts/check-version.sh
      - run: cargo fmt --all -- --check
      # --all-targets 覆盖测试代码，否则测试里的 clippy 问题会漏到主干
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # export_bindings 是 cargo test 的一部分：TS 类型生成失败会在这里暴露
      - run: cargo test --workspace
      # 生成物必须与提交的一致，否则说明改了 Rust 忘了重新生成 TS 类型
      - name: TypeScript 绑定是否最新
        run: |
          cargo test -p foldersync-desktop export_bindings
          git diff --exit-code apps/desktop/src/lib/bindings/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check src
      - run: pnpm exec eslint src
      # 严格类型检查独立于构建，避免 vite 打包漏掉类型错误
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
